        <path d="M0,0 L10,4 L0,8 z" fill="#274C77"/>
      </marker>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="1.6" stdDeviation="1.5" flood-color="#6B7280" flood-opacity="0.20"/>
      </filter>
    </defs>
    
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="590.0" y="34" text-anchor="middle" font-size="24" font-weight="700" font-family="Microsoft YaHei, SimHei, Arial" fill="#0B2545">批量重命名事务活动图</text>
<text x="590.0" y="60" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, SimSun, Arial" fill="#5B677A">状态图可选，本系统选择对事务风险最高的批量重命名绘制活动图</text>
<circle cx="120" cy="115" r="20" fill="#17202A"/>
