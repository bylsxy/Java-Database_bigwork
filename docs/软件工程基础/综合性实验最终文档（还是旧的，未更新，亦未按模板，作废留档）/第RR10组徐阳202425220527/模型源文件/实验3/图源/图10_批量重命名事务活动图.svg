<rect x="810" y="240" width="210" height="70" rx="8" fill="#FFF7E6" stroke="#274C77" stroke-width="1.4" filter="url(#shadow)"/>
<text x="915.0" y="280.0" font-size="15" text-anchor="middle" font-family="Microsoft YaHei, SimSun, Arial" fill="#17202A"><tspan x="915.0" dy="0.0">触发器写operation_logs</tspan></text>
