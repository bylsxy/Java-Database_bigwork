# ============================================================
# PostgreSQL 数据库连接配置
# 本文件由 DatabaseConnection 类在启动时加载
# ============================================================

# 数据库连接基本信息
db.url=jdbc:postgresql://localhost:5432/image_manager
db.username=postgres
# 不提交真实密码；请使用应用内数据库向导、本机外部配置或 DIMS_DB_PASSWORD。
db.password=

# HikariCP 连接池配置
# maximumPoolSize: 连接池中最大连接数，桌面应用不需要太大
db.pool.maximumPoolSize=10
# minimumIdle: 最小空闲连接数
db.pool.minimumIdle=2
# connectionTimeout: 获取连接的最大等待时间（毫秒），启动自检需要快速失败并打开向导
db.pool.connectionTimeout=5000
# idleTimeout: 连接在池中保持空闲的最大时间（毫秒）
db.pool.idleTimeout=600000
